<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout ♡ | SAL'VES Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        .checkout-page {
            max-width: 1100px;
            margin: auto;
            padding: 60px 25px 100px;
        }

        .checkout-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .checkout-heading h1 {
            margin: 10px 0;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 30px;
            align-items: start;
        }

        .checkout-card,
        .checkout-summary {
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .checkout-card h2,
        .checkout-summary h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(111,81,67,.2);
            border-radius: 14px;
            background: var(--cream);
            color: var(--brown-dark);
            font-family: "Quicksand", sans-serif;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--pink);
        }

        .checkout-items {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .checkout-item {
            display: grid;
            grid-template-columns: 60px 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .checkout-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 14px;
        }

        .checkout-item h3 {
            margin: 0;
            font-size: 15px;
        }

        .checkout-item p {
            margin: 3px 0 0;
            font-size: 13px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin: 14px 0;
        }

        .checkout-total {
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed rgba(111,81,67,.2);
            padding-top: 20px;
            margin-top: 20px;
            font-size: 21px;
            font-weight: 800;
        }

        .place-order {
            width: 100%;
            margin-top: 25px;
            cursor: pointer;
        }

        .secure-note {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
        }

        .empty-checkout {
            text-align: center;
            padding: 70px 20px;
        }

        @media (max-width: 800px) {

            .checkout-layout {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<main class="checkout-page">

    <section class="checkout-heading">

        <div class="little-label">
            🎀 Almost yours
        </div>

        <h1>
            Checkout <span>♡</span>
        </h1>

        <p>
            Just a few little details before your yarn hugs are on their way.
        </p>

    </section>


    <div id="checkout-content"></div>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const cart =
        JSON.parse(localStorage.getItem("salvesCart")) || [];

    const container =
        document.getElementById("checkout-content");


    /* EMPTY CART */

    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty-checkout">

                <h2>Your cart is empty ♡</h2>

                <p>Add something cute before checking out!</p>

                <a href="shop.html"
                   class="cute-button">

                    Go To Shop ♡

                </a>

            </div>

        `;

        return;
    }


    let subtotal = 0;

    let totalItems = 0;


    cart.forEach(item => {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        subtotal += price * quantity;

        totalItems += quantity;

    });


    const total = subtotal;


    container.innerHTML = `

        <div class="checkout-layout">


            <section class="checkout-card">

                <h2>
                    Your Details 💌
                </h2>


                <form id="checkout-form">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="customer-name"
                            placeholder="Your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="customer-email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="customer-phone"
                            placeholder="Your phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Delivery Address
                        </label>

                        <textarea
                            id="customer-address"
                            placeholder="House / building, street, area..."
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Payment Method
                        </label>

                        <select id="payment-method" required>

                            <option value="">
                                Select payment method
                            </option>

                            <option value="cash">
                                Cash on Delivery
                            </option>

                            <option value="card">
                                Card Payment
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="cute-button place-order">

                        Place Order ♡

                    </button>


                </form>

            </section>


            <aside class="checkout-summary">

                <h2>
                    Your Order 🧺
                </h2>


                <div class="checkout-items">

                    ${cart.map(item => `

                        <div class="checkout-item">

                            <img
                                src="${item.image}"
                                alt="${item.name}"
                            >

                            <div>

                                <h3>
                                    ${item.name}
                                </h3>

                                <p>
                                    ${item.quantity} ×
                                    ${Number(item.price).toFixed(2)} OMR
                                </p>

                            </div>

                            <strong>
                                ${(Number(item.price) * Number(item.quantity)).toFixed(2)}
                                OMR
                            </strong>

                        </div>

                    `).join("")}

                </div>


                <div class="summary-line">

                    <span>
                        Items
                    </span>

                    <strong>
                        ${totalItems}
                    </strong>

                </div>


                <div class="summary-line">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ${subtotal.toFixed(2)} OMR
                    </strong>

                </div>


                <div class="summary-line">

                    <span>
                        Delivery
                    </span>

                    <strong>
                        Free ♡
                    </strong>

                </div>


                <div class="checkout-total">

                    <span>
                        Total
                    </span>

                    <strong>
                        ${total.toFixed(2)} OMR
                    </strong>

                </div>


                <p class="secure-note">
                    🧶 Handmade with love • Safe & simple checkout
                </p>

            </aside>

        </div>

    `;


    /* PLACE ORDER */

    document
        .getElementById("checkout-form")
        .addEventListener("submit", function (event) {

            event.preventDefault();


            const order = {

                name:
                    document.getElementById(
                        "customer-name"
                    ).value,

                email:
                    document.getElementById(
                        "customer-email"
                    ).value,

                phone:
                    document.getElementById(
                        "customer-phone"
                    ).value,

                address:
                    document.getElementById(
                        "customer-address"
                    ).value,

                payment:
                    document.getElementById(
                        "payment-method"
                    ).value,

                items: cart,

                total: total,

                date:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "salvesLastOrder",
                JSON.stringify(order)
            );


            /* EMPTY CART AFTER ORDER */

            localStorage.removeItem(
                "salvesCart"
            );


            window.location.href =
                "success.html";

        });

});

</script>

</body>
</html>
